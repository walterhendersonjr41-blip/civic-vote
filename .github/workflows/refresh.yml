name: refresh-data
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
        env: { CONGRESS_API_KEY: '${{ secrets.CONGRESS_API_KEY }}' }
      - run: node scripts/export.mjs
      - run: |
          git config user.name "civic-vote-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/items.json api
          git diff --cached --quiet || (git commit -m "Refresh data" && git pull --rebase && git push)
